[workspace]
members = ["crates/musit-core", "crates/immersion"]
resolver = "2"

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
# gpui-ce is the community edition of Zed's GPUI, synced from Zed and published
# to crates.io. It is imported as `gpui` so the code reads as GPUI code, and it
# is the edition vampir builds against, so both crates share one set of types.
gpui = { package = "gpui-ce", version = "0.2.2" }
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
flate2 = "1"
regex = "1"
once_cell = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "7"
notify = "8"
tempfile = "3"

[profile.release]
lto = "thin"

# Distribution builds: scripts/package-macos.sh --production and
# scripts/package-windows.ps1 -Production build with this profile.
[profile.production]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

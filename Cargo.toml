[workspace]
members = ["crates/musit-core", "crates/immersion"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
flate2 = "1"
regex = "1"
once_cell = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5"
notify = "8"
tempfile = "3"

[profile.release]
lto = "thin"

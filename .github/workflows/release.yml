name: Release

# Pushing a tag such as v0.2.1 builds the distributable installers and
# publishes them on a GitHub release: the macOS DMG and Windows installer use
# the `production` cargo profile, and Linux native packages, AppImage, and
# tarball use `release`. The tag must match the workspace version in
# Cargo.toml, and RELEASE_TITLE must name that version and its main features,
# so the file names and the release agree.
#
# The macOS bundle is ad-hoc signed unless IMMERSION_SIGN_IDENTITY is set;
# to sign with a Developer ID, import the certificate into the runner's
# keychain in a step before packaging and export that variable.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: The tag is the version in Cargo.toml
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag v$tag does not match Cargo.toml version $version" >&2
            exit 1
          fi
          title="$(cat RELEASE_TITLE)"
          case "$title" in
            "Immersion $version — "*) ;;
            *) echo "RELEASE_TITLE must start with 'Immersion $version — '" >&2; exit 1 ;;
          esac

      - run: cargo fmt --all --check
      - run: cargo test --workspace

  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Package the DMG
        run: scripts/package-macos.sh --production

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Immersion-*.dmg
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # NSIS ships on the GitHub Windows image; this covers an image without it.
      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Package the installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\package-windows.ps1 -Production

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/ImmersionSetup-*.exe
          if-no-files-found: error

  linux:
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev libfreetype-dev libvulkan-dev libx11-dev libxcb1-dev pkg-config

      - name: Build Linux binary
        run: cargo build --release --locked -p immersion

      - name: Packaging tools
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          curl -fsSL -o /tmp/linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          chmod +x /tmp/linuxdeploy.AppImage
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec /tmp/linuxdeploy.AppImage --appimage-extract-and-run "$@"\n' > "$HOME/.local/bin/linuxdeploy"
          chmod +x "$HOME/.local/bin/linuxdeploy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Package Linux releases
        run: scripts/package-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$(cat RELEASE_TITLE)" \
            --generate-notes

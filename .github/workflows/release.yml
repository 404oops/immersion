name: Release

# Pushing a version tag builds the distributable installers and
# publishes them on a GitHub release: the macOS DMG and Windows installer use
# the `production` cargo profile, and Linux native packages, AppImage, and
# tarball use `release`. The tag must match the workspace version in
# Cargo.toml, and RELEASE_TITLE must name that version and its main features,
# so the file names and the release agree.
#
# The macOS bundle is ad-hoc signed unless IMMERSION_SIGN_IDENTITY is set;
# to sign with a Developer ID, import the certificate into the runner's
# keychain in a step before packaging and export that variable.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  IMMERSION_UPDATE_PUBLIC_KEY: ${{ vars.IMMERSION_UPDATE_PUBLIC_KEY }}

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Update signing is configured
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.IMMERSION_UPDATE_PRIVATE_KEY }}
        run: |
          test -n "$IMMERSION_UPDATE_PUBLIC_KEY"
          test -n "$UPDATE_PRIVATE_KEY"

      - name: The tag is the version in Cargo.toml
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag v$tag does not match Cargo.toml version $version" >&2
            exit 1
          fi
          title="$(cat RELEASE_TITLE)"
          case "$title" in
            "Immersion $version — "*) ;;
            *) echo "RELEASE_TITLE must start with 'Immersion $version — '" >&2; exit 1 ;;
          esac

      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked

  macos:
    needs: check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Package the DMG
        run: scripts/package-macos.sh --production

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            dist/Immersion-*.dmg
            dist/Immersion-*.zip
          if-no-files-found: error

  windows:
    needs: check
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # NSIS ships on the GitHub Windows image; this covers an image without it.
      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Package the installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\package-windows.ps1 -Production -Architecture ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/ImmersionSetup-*.exe
          if-no-files-found: error

  linux:
    needs: check
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev libfreetype-dev libvulkan-dev libx11-dev libxcb1-dev pkg-config

      - name: Build Linux binary
        run: cargo build --release --locked -p immersion

      - name: Packaging tools
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          curl -fsSL -o /tmp/linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-${{ matrix.arch }}.AppImage
          chmod +x /tmp/linuxdeploy.AppImage
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec /tmp/linuxdeploy.AppImage --appimage-extract-and-run "$@"\n' > "$HOME/.local/bin/linuxdeploy"
          chmod +x "$HOME/.local/bin/linuxdeploy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Package Linux releases
        run: scripts/package-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [macos, windows, linux]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Sign platform update metadata
        env:
          IMMERSION_UPDATE_PRIVATE_KEY: ${{ secrets.IMMERSION_UPDATE_PRIVATE_KEY }}
        run: |
          scripts/fetch-sparkle.sh target/sparkle-2.10.0
          python -m venv "$RUNNER_TEMP/immersion-update-signing"
          "$RUNNER_TEMP/immersion-update-signing/bin/python" -m pip install 'cryptography>=46,<47'
          "$RUNNER_TEMP/immersion-update-signing/bin/python" -m unittest discover -s scripts/tests -v
          "$RUNNER_TEMP/immersion-update-signing/bin/python" scripts/publish-updates.py --version "${GITHUB_REF_NAME#v}" --sparkle target/sparkle-2.10.0

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          version="${GITHUB_REF_NAME#v}"
          asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          notes=$(cat <<EOF
          ## Downloads

          1. [macOS ARM64](${asset_url}/Immersion-${version}-macos-arm64.dmg)
          2. [Windows x64](${asset_url}/ImmersionSetup-${version}-windows-x64.exe)
          3. [Windows ARM64](${asset_url}/ImmersionSetup-${version}-windows-arm64.exe)
          4. Linux x64: [Debian/Ubuntu](${asset_url}/Immersion-${version}-linux-x86_64.deb), [Fedora/RHEL](${asset_url}/Immersion-${version}-linux-x86_64.rpm), [Arch](${asset_url}/Immersion-${version}-linux-x86_64.pkg.tar.zst), [AppImage](${asset_url}/Immersion-${version}-linux-x86_64.AppImage), [portable](${asset_url}/Immersion-${version}-linux-x86_64.tar.gz)
          5. Linux ARM64: [Debian/Ubuntu](${asset_url}/Immersion-${version}-linux-aarch64.deb), [Fedora/RHEL](${asset_url}/Immersion-${version}-linux-aarch64.rpm), [Arch](${asset_url}/Immersion-${version}-linux-aarch64.pkg.tar.zst), [AppImage](${asset_url}/Immersion-${version}-linux-aarch64.AppImage), [portable](${asset_url}/Immersion-${version}-linux-aarch64.tar.gz)

          ## Linux support

          Linux builds are provided so Immersion can run on Linux. If you use one, you are responsible for diagnosing and fixing any issues yourself. The project does not provide Linux troubleshooting or fixes.
          EOF
          )
          gh release create "$GITHUB_REF_NAME" \
            "dist/Immersion-${version}-macos-arm64.dmg#macOS ARM64" \
            "dist/ImmersionSetup-${version}-windows-x64.exe#Windows x64" \
            "dist/ImmersionSetup-${version}-windows-arm64.exe#Windows ARM64" \
            "dist/Immersion-${version}-linux-x86_64.deb#Linux x64 — Debian/Ubuntu" \
            "dist/Immersion-${version}-linux-x86_64.rpm#Linux x64 — Fedora/RHEL" \
            "dist/Immersion-${version}-linux-x86_64.pkg.tar.zst#Linux x64 — Arch" \
            "dist/Immersion-${version}-linux-x86_64.AppImage#Linux x64 — AppImage" \
            "dist/Immersion-${version}-linux-x86_64.tar.gz#Linux x64 — portable" \
            "dist/Immersion-${version}-linux-aarch64.deb#Linux ARM64 — Debian/Ubuntu" \
            "dist/Immersion-${version}-linux-aarch64.rpm#Linux ARM64 — Fedora/RHEL" \
            "dist/Immersion-${version}-linux-aarch64.pkg.tar.zst#Linux ARM64 — Arch" \
            "dist/Immersion-${version}-linux-aarch64.AppImage#Linux ARM64 — AppImage" \
            "dist/Immersion-${version}-linux-aarch64.tar.gz#Linux ARM64 — portable" \
            "dist/Immersion-${version}-macos-arm64.zip#macOS ARM64 — automatic update archive" \
            "dist/appcast-macos-arm64.xml" \
            "dist/update-windows-x64.json" "dist/update-windows-x64.json.sig" \
            "dist/update-windows-arm64.json" "dist/update-windows-arm64.json.sig" \
            --title "$(cat RELEASE_TITLE)" \
            --notes "$notes" \
            --generate-notes

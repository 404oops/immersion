[package]
name = "immersion"
version.workspace = true
edition.workspace = true
build = "build.rs"

[build-dependencies]
# Embeds the exe icon + version info on Windows targets (Immersion.rc.in
# equivalent); a no-op on other targets.
winresource = "0.1"

[dependencies]
musit-core = { path = "../musit-core" }
vampir = { path = "../vampir" }
gpui.workspace = true
gpui_platform = { git = "https://github.com/zed-industries/zed", branch = "main", features = ["font-kit", "runtime_shaders"] }
unicode-segmentation.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
dirs.workspace = true
once_cell.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSResponder",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSButton",
    "NSControl",
    "NSView",
    "NSMenu",
    "NSMenuItem",
    "NSImage",
    "NSEvent",
    "NSCell",
    "NSRunningApplication",
    "NSWorkspace",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImageRep",
    "NSBitmapImageRep",
    "objc2-uniform-type-identifiers",
] }
objc2-uniform-type-identifiers = { version = "0.3", features = ["UTType"] }
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSBundle",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSGeometry",
    "NSObject",
    "NSNotification",
    "NSOperation",
    "block2",
] }
objc2-user-notifications = { version = "0.3", features = [
    "UNUserNotificationCenter",
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationSettings",
    "UNNotificationSound",
    "block2",
] }
objc2-service-management = { version = "0.3", features = ["SMAppService"] }
block2 = "0.6"
# PNG encoding for OS type icons (platform/icon_pixels.rs); already in the
# tree via gpui.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Shell type icons (platform/win.rs). `windows` is already in the tree via
# gpui; `image` too, and only its PNG encoder is enabled here.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
image = { version = "0.25", default-features = false, features = ["png"] }

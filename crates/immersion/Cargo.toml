[package]
name = "immersion"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[build-dependencies]
# Embeds the exe icon + version info on Windows targets (Immersion.rc.in
# equivalent); a no-op on other targets.
winresource = "0.1"

[dependencies]
musit-core = { path = "../musit-core" }
# The widget toolkit (https://github.com/404oops/vampir), from crates.io.
vampir = "0.1.5"
gpui.workspace = true
# The platform backend for gpui-ce. `runtime_shaders` compiles the Metal
# shaders at startup so a machine with only the command line tools can build.
gpui_platform = { package = "gpui_ce_platform", version = "0.1.0", features = ["font-kit", "runtime_shaders", "x11"] }
unicode-segmentation.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
dirs.workspace = true
once_cell.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", features = ["blocking"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Withdrawing the main window to the tray (platform/linux_window.rs); both
# are already in the tree via GPUI's X11 backend.
x11rb = "0.13"
raw-window-handle = "0.6"
# Save notifications without GPUI's unhandled default action
# (platform/linux.rs); already in the tree via GPUI.
notify-rust = "4"
# The desktop icon theme via the Settings portal (platform/linux_icons.rs);
# already in the tree via ksni and notify-rust.
zbus = "5"
# SVG icon themes for file type icons (platform/linux_icons.rs); already in
# the tree via GPUI, whose features it shares.
resvg = { version = "0.48", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSResponder",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSButton",
    "NSControl",
    "NSView",
    "NSMenu",
    "NSMenuItem",
    "NSImage",
    "NSEvent",
    "NSCell",
    "NSRunningApplication",
    "NSWorkspace",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImageRep",
    "NSBitmapImageRep",
    "objc2-uniform-type-identifiers",
] }
objc2-uniform-type-identifiers = { version = "0.3", features = ["UTType"] }
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSBundle",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSGeometry",
    "NSObject",
    "NSNotification",
    "NSOperation",
    "block2",
] }
objc2-user-notifications = { version = "0.3", features = [
    "UNUserNotificationCenter",
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationSettings",
    "UNNotificationSound",
    "block2",
] }
objc2-service-management = { version = "0.3", features = ["SMAppService"] }
block2 = "0.6"
# PNG encoding for OS type icons (platform/icon_pixels.rs); already in the
# tree via gpui.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Shell type icons (platform/win.rs). `windows` is already in the tree via
# gpui; `image` too, and only its PNG encoder is enabled here.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
